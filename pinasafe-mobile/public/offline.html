<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#B42318" />
  <title>PinaSafe - Offline</title>
  <link rel="icon" href="/icons/favicon-48.png" />
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F7F7F5; color: #182230; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); box-sizing: border-box; }
    main { max-width: 440px; background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 18px; padding: 32px; text-align: center; }
    img { width: 72px; height: 72px; }
    h1 { font-size: 22px; line-height: 1.2; margin: 16px 0 8px; }
    p { font-size: 15px; line-height: 1.5; color: #475467; margin: 0 0 16px; }
    button { min-height: 48px; padding: 0 24px; border-radius: 12px; border: 1px solid #B42318; background: #B42318; color: #FFFFFF; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:focus-visible { outline: 3px solid #175CD3; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="PinaSafe" />
    <h1>You are offline</h1>
    <p>PinaSafe needs an internet connection to send reports and receive live updates. Nothing is sent while you are offline.</p>
    <p>For immediate danger, call your local emergency hotline.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
